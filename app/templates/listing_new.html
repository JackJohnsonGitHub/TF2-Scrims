{% extends "base.html" %}
{% block title %}New listing · TF2 Hosting{% endblock %}
{% block screen %}scrims{% endblock %}

{% block content %}
<div class="page-head">
  <h1>Post an open listing</h1>
  <a class="btn" href="{{ url_for('scrims.index') }}">← All scrims</a>
</div>

<section class="card">
  <p class="muted">Any same-format team can claim your listing, which confirms the scrim.</p>
  <form method="post" action="{{ url_for('scrims.new_listing') }}">
    <div class="field">
      <label for="team_id">Your team</label>
      <select id="team_id" name="team_id" required>
        {% for t in my_teams %}
        <option value="{{ t.rgl_team_id }}">{{ t.name }} ({{ format_labels.get(t.format, t.format) }})</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label for="scheduled_at">Date &amp; time (your local time)</label>
      <input type="datetime-local" id="scheduled_at" name="scheduled_at" required>
      <input type="hidden" name="tz_offset" id="tz_offset" value="0">
    </div>
    <div class="field">
      <label for="notes">Notes (optional)</label>
      <input type="text" id="notes" name="notes" maxlength="200" placeholder="e.g. maps, server preferences">
    </div>
    <button class="btn btn-primary" type="submit">Post listing</button>
  </form>
</section>

<script>
  // Store scrim times in UTC: submit the browser's offset so the server converts.
  document.getElementById("tz_offset").value = new Date().getTimezoneOffset();
</script>
{% endblock %}
