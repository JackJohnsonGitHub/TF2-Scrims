# EXAMPLE ONLY — do NOT commit real values. Documents the keys the app expects.
#
# Per the constitution (Principle IV), these secrets live in OpenBao
# (https://secrets.irulast.com), not in this repo. Get them into the cluster as the
# `tf2-hosting-secrets` Secret by ONE of:
#
#   1. OpenBao/Vault sync — an External Secrets Operator or vault-agent injector that
#      materializes the Secret from OpenBao (preferred; coordinate via bare-metal-k8s-setup).
#   2. Manual one-off (no plaintext on disk):
#        kubectl create secret generic tf2-hosting-secrets \
#          --from-literal=app-secret-key="$(bao kv get -field=app_secret_key secret/tf2-hosting)" \
#          --from-literal=steam-api-key="$(bao kv get -field=steam_api_key secret/tf2-hosting)"
#
# Keys:
#   app-secret-key : random 32+ byte hex — signs the sign-in session cookie.
#   steam-api-key  : a Steam Web API key — persona name + avatar lookup.
apiVersion: v1
kind: Secret
metadata:
  name: tf2-hosting-secrets
  labels:
    app: tf2-hosting-app
type: Opaque
stringData:
  app-secret-key: "REPLACE-FROM-OPENBAO"
  steam-api-key: "REPLACE-FROM-OPENBAO"
